# Push a vX.Y.Z tag → build both flavors on Linux, sign with the release key, verify the
# fdroid APK the way F-Droid will, and publish a GitHub release. The signing key lives in the
# "release" environment, which only runs after the maintainer approves the deployment.
#
# Run it by hand (Actions → Release → Run workflow) on an existing tag with publish off to
# get the signed APKs as an artifact without touching any release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (vX.Y.Z)"
        required: true
      publish:
        description: "Create the GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0 # the APK records the commit, and release.sh checks the tag
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Tests
        run: ./gradlew --no-daemon testFdroidDebugUnitTest

      - name: Whistle (full flavor only, pinned and hash-checked)
        run: ./scripts/fetch-whistle.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=listen-here\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/signing.properties"

      - name: Build and sign
        env:
          LISTENHERE_SIGNING: ${{ runner.temp }}/signing.properties
        run: ./scripts/release.sh

      - name: Verify like F-Droid (signature copied onto the unsigned build)
        run: |
          pipx run apksigcopier==1.1.1 compare dist/*-fdroid.apk \
            --unsigned app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          cp app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk dist/unsigned-fdroid.apk.check
          (cd dist && sha256sum ./*.apk > SHA256SUMS && cat SHA256SUMS && sha256sum unsigned-fdroid.apk.check)

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/signing.properties"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: listen-here-${{ env.TAG }}
          path: dist/

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' app/build.gradle)
          NOTES=fastlane/metadata/android/en-US/changelogs/$CODE.txt
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS --title "Listen Here ${TAG#v}" \
            --notes-file "$NOTES" --verify-tag
