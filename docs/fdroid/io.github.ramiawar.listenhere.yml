# Recipe for https://gitlab.com/fdroid/fdroiddata (metadata/io.github.ramiawar.listenhere.yml).
# Builds the fdroid flavor entirely from source (whisper.cpp is a git submodule; no model is
# bundled). Reproducible: F-Droid publishes the developer-signed APK from Binaries when its own
# build matches it (see scripts/release.sh).
Categories:
