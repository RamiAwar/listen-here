  - Note
  - Speech Recognizer
License: GPL-3.0-only
AuthorName: Rami Awar
AuthorWebSite: https://github.com/RamiAwar
SourceCode: https://github.com/RamiAwar/listen-here
IssueTracker: https://github.com/RamiAwar/listen-here/issues
Changelog: https://github.com/RamiAwar/listen-here/releases

AutoName: Listen Here

RepoType: git
Repo: https://github.com/RamiAwar/listen-here.git
Binaries: https://github.com/RamiAwar/listen-here/releases/download/v%v/listen-here-%v-fdroid.apk

Builds:
  - versionName: 0.3.0
    versionCode: 1
    commit: 56d2011163eb8162e6b0ded38700f859d16df6c3
    subdir: app
    submodules: true
    # whisper.cpp's test models and its example/binding apps aren't part of our build.
    scandelete:
