plugins {
    id "com.android.application"
}

android {
    namespace "io.github.ramiawar.listenhere"
    compileSdk 35
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "io.github.ramiawar.listenhere"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.3.0"
        // The speech engines are built for arm64 only; every GrapheneOS phone is arm64.
        ndk { abiFilters "arm64-v8a" }
    }

    // full: bundles Cactus Whistle (prebuilt engine), plus Whisper models you import.
    // fdroid: everything built from source; Whisper only.
    flavorDimensions += "dist"
    productFlavors {
        full {
            dimension "dist"
            externalNativeBuild { cmake { arguments "-DWITH_WHISTLE=ON" } }
        }
        fdroid {
            dimension "dist"
        }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }

    // Stored uncompressed so Whistle's model can be memory-mapped straight out of the APK.
    androidResources { noCompress += "cact" }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Signed with the debug key so `./gradlew assembleRelease` gives an installable APK.
            // Swap in your own keystore if you publish it.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo { includeInApk false; includeInBundle false }
}

// No runtime dependencies: only the Android framework.
dependencies {
    testImplementation "junit:junit:4.13.2"
}
